<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      OG 이미지 원본 (1200×630). scripts/gen-og-image.mjs 가 헤드리스 크롬으로
      이 파일을 캡처해 presentation/public/og.png 를 만든다.

      설계 — 카카오톡 미리보기는 실제로 작게 뜬다. 문구 하나와 도형 하나만 둔다.
      오른쪽 도형은 방 → 건물 → 동네 로 커지는 사업 모델 자체를 그린 것이다.

      폰트는 node_modules 의 Pretendard 를 직접 참조한다 — 시스템 폰트 폴백에
      기대면 캡처 환경마다 결과가 달라진다.
    -->
    <style>
      @font-face {
        font-family: 'Pretendard';
        src: url('../node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraBold.woff2')
          format('woff2');
        font-weight: 800;
      }
      @font-face {
        font-family: 'Pretendard';
        src: url('../node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2')
          format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'Pretendard';
        src: url('../node_modules/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2')
          format('woff2');
        font-weight: 400;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 88px;
        background: #111214;
        font-family: 'Pretendard', sans-serif;
        color: #fff;
        word-break: keep-all;
      }

      /* 우하단 오렌지 글로우 — 단색 배경이 죽지 않게. */
      .glow {
        position: absolute;
        right: -220px;
        bottom: -300px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 26, 0.26), transparent 66%);
      }

      .copy {
        position: relative;
        flex: 1;
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .wordmark i {
        width: 8px;
        height: 8px;
        margin-left: 3px;
        border-radius: 50%;
        background: #ff6b1a;
      }

      .headline {
        margin-top: 38px;
        font-size: 78px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.18;
      }
      .headline em {
        font-style: normal;
        color: #ff6b1a;
      }

      .caption {
        margin-top: 28px;
        font-size: 25px;
        font-weight: 400;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.5);
      }

      /* ── 방 → 건물 → 동네 스케일 그래픽 ─────────────────────── */
      .scale {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-shrink: 0;
      }

      .box {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        border-radius: 20px;
        padding: 14px;
      }
      .box b {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
      }
      .box span {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.6;
      }

      .box--room {
        width: 86px;
        height: 86px;
        background: #fff;
        color: #111214;
        border-radius: 16px;
      }
      .box--building {
        width: 134px;
        height: 134px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .box--town {
        width: 196px;
        height: 196px;
        border: 2px solid rgba(255, 107, 26, 0.75);
        color: #ff6b1a;
        border-radius: 26px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="copy">
      <p class="wordmark">GREYO<i></i></p>

      <h1 class="headline">방은 15m²,<br /><em>집은 건물 전체.</em></h1>

      <p class="caption">필요한 공간만 멤버십으로 —<br />라운지 · 사우나 · 퍼블릭 오피스</p>
    </div>

    <div class="scale">
      <div class="box box--room"><b>방</b><span>15m²</span></div>
      <div class="box box--building"><b>건물</b><span>어메니티</span></div>
      <div class="box box--town"><b>동네</b><span>도보 5분</span></div>
    </div>
  </body>
</html>
